name: Continuous Integration

# Every `uses:` below is pinned to a full commit SHA to defend against
# tag-mutation supply-chain attacks; the trailing `# vX.Y.Z` comment records
# which release the SHA corresponds to. Keep that comment inline and in that
# exact form — it is what Dependabot's github-actions updater rewrites when it
# bumps a pin. Bump intentionally; never switch back to a floating tag.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[a2a,dev]" -e ./packages/ap3-functions

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/ap3 packages/ap3-functions/ap3_functions

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[a2a,test]" -e ./packages/ap3-functions

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Generate coverage report
        run: pytest tests/unit/ --cov=src/ap3 --cov-report=term --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always()
        with:
          # `file` was deprecated in favour of `files` in codecov-action v5.
          files: ./coverage.xml
          fail_ci_if_error: false

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[a2a,test]" -e ./packages/ap3-functions

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
